---
# _oraswgi_install_cvuqdisk_src: install the RPM from this path (Oracle Restart)
# default: RPM copied to oracle_rsp_stage on all cluster nodes
- name: install_home_gi | Install cvuqdisk rpm
  # noqa ignore-errors
  vars:
    __cvuqdisk_src: "{{ _oraswgi_install_cvuqdisk_src | default(oracle_rsp_stage + '/' + cvuqdisk_rpm) }}"
  when:
    - _oraswgi_meta_configure_cluster or _oraswgi_install_cvuqdisk_src is defined
  tags: cvuqdisk
  ignore_errors: true
  block:
    - name: install_home_gi | Install cvuqdisk rpm (non-FIPS)
      ansible.builtin.yum:  # noqa fqcn[action-core]
        name: "{{ __cvuqdisk_src }}"
        disable_gpg_check: true
        state: present
      when:
        - not ansible_fips

    - name: install_home_gi | Install cvuqdisk rpm (FIPS)
      # noqa command-instead-of-module
      ansible.builtin.command:
        "rpm --upgrade --nodigest --nofiledigest {{ __cvuqdisk_src }}"
      register: _oraswgi_install_cvuqdisk_result
      changed_when: _oraswgi_install_cvuqdisk_result.rc == 0
      when:
        - ansible_fips
