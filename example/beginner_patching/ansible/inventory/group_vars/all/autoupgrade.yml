---
autoupgrade_run_local: false
autoupgrade_download_use_oracle_sw_patches: false
autoupgrade_download_latest: true

autoupgrade_download_gold_image_rename: true
# db_home_26_latest.zip -> latest downloaded Gold Image for 26ai (imagename in db-homes.yml)
autoupgrade_download_gold_image_latest: true
autoupgrade_jar_filesource: /u01/stage/autoupgrade.jar

autoupgrade_download_patches:
  - target_version: 19
    patch: RECOMMENDED
    gold_image: "ALL"
    platform: LINUX.X64
  - target_version: 19
    patch: RU:19.32,DPBP
    gold_image: "ALL"
    platform: LINUX.X64
